services:
  open-agents:
    image: ghcr.io/agentic-girl/open-agents:latest
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_PATH=/data/open-agents.db
      - WORKSPACE_ROOT=/workspaces
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-5-5}
    volumes:
      - open-agents-data:/data
      - open-agents-workspaces:/workspaces
    restart: unless-stopped

volumes:
  open-agents-data:
  open-agents-workspaces:
