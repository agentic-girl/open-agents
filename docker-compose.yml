services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: open-agents-server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_PATH=/data/open-agents.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - open-agents-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: open-agents-web
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  open-agents-data:
